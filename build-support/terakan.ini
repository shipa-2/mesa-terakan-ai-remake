# Meson options for a Terakan development build.
#
# Everything here is what a build of this driver needs and nothing else: only the amd_terascale
# Vulkan driver, no Gallium, no GL/GLES/EGL/GBM entry points and no LLVM, so a build stays to the
# driver and its own tests and never replaces the distribution's Mesa.
#
# Use it directly, no wrapper needed:
#
#     meson setup build --native-file build-support/terakan.ini
#     meson compile -C build
#     meson test -C build
#
# bin/terakan-build passes this same file, so the two cannot describe different builds.
#
# terakan-target-generation is deliberately absent: its default is auto, and a build for another
# generation asks for it on the command line, for instance
# -Dterakan-target-generation=r700.

[built-in options]
# A PKG_CONFIG_PATH in the caller's environment pointing at /usr/lib32/pkgconfig -- which a machine
# set up to build 32-bit software has -- otherwise makes the link pick the 32-bit libvulkan and
# fail on every test binary with "file in wrong format". Naming the 64-bit directories here takes
# precedence over the environment.
pkg_config_path = ['/usr/lib/pkgconfig', '/usr/share/pkgconfig']
prefix = '/usr'
libdir = 'lib'
buildtype = 'release'
wrap_mode = 'nodownload'

[project options]
vulkan-drivers = ['amd_terascale']
gallium-drivers = []
glx = 'disabled'
egl = 'disabled'
gbm = 'disabled'
opengl = false
gles1 = 'disabled'
gles2 = 'disabled'
llvm = 'disabled'
valgrind = 'disabled'
lmsensors = 'disabled'
zstd = 'enabled'
shader-cache = 'enabled'
libunwind = 'disabled'
platforms = ['x11', 'wayland']
build-tests = true
tools = []
